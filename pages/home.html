<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="icon" href="../img/favicon.ico" type="image/x-icon">
    <title>Home</title>
</head>

<body>
    <header-component></header-component>

    <main>
        <div class="search-wrapper">
            <input id="searchInput" type="search" placeholder="Busca un anime..." autocomplete="off" />
            <button id="filterButton" class="filter-btn" aria-label="Filtros" title="Filtros">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M4.5 3h15a1.5 1.5 0 0 1 1.17 2.44L14 13.5v5.38a1.5 1.5 0 0 1-.83 1.34l-2 1A1.5 1.5 0 0 1 9 19.88V13.5L3.33 5.44A1.5 1.5 0 0 1 4.5 3Z" />
                </svg>
            </button>
            <button id="clearFiltersButton" type="button" aria-label="Limpiar Filtros" title="Limpiar Filtros">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M3.5 4.5h17L14 12.2v6.1l-4 2v-8.1L3.5 4.5Z" />
                    <path d="m5 3 14 18" />
                </svg>
            </button>
            <div id="filterDropdown" class="filter-dropdown hidden">
                <div class="filter-header">
                    <div>
                        <h2>Filtros de búsqueda</h2>
                        <p>Selecciona uno o varios géneros</p>
                    </div>
                    <span class="filter-header-icon" aria-hidden="true">✦</span>
                </div>
                <div class="genres-list">
                    <label><input type="checkbox" name="genre" value="action" /> Acción</label>
                    <label><input type="checkbox" name="genre" value="adventure" /> Aventura</label>
                    <label><input type="checkbox" name="genre" value="cars" /> Coches</label>
                    <label><input type="checkbox" name="genre" value="comedy" /> Comedia</label>
                    <label><input type="checkbox" name="genre" value="dementia" /> Demencia</label>
                    <label><input type="checkbox" name="genre" value="demons" /> Demonios</label>
                    <label><input type="checkbox" name="genre" value="mystery" /> Misterio</label>
                    <label><input type="checkbox" name="genre" value="drama" /> Drama</label>
                    <label><input type="checkbox" name="genre" value="ecchi" /> Ecchi</label>
                    <label><input type="checkbox" name="genre" value="fantasy" /> Fantasía</label>
                    <label><input type="checkbox" name="genre" value="game" /> Juegos</label>
                    <label><input type="checkbox" name="genre" value="hentai" /> Hentai</label>
                    <label><input type="checkbox" name="genre" value="historical" /> Histórico</label>
                    <label><input type="checkbox" name="genre" value="horror" /> Terror</label>
                    <label><input type="checkbox" name="genre" value="kids" /> Infantil</label>
                    <label><input type="checkbox" name="genre" value="magic" /> Magia</label>
                    <label><input type="checkbox" name="genre" value="martial-arts" /> Artes marciales</label>
                    <label><input type="checkbox" name="genre" value="mecha" /> Mecha</label>
                    <label><input type="checkbox" name="genre" value="music" /> Música</label>
                    <label><input type="checkbox" name="genre" value="parody" /> Parodia</label>
                    <label><input type="checkbox" name="genre" value="samurai" /> Samurái</label>
                    <label><input type="checkbox" name="genre" value="romance" /> Romance</label>
                    <label><input type="checkbox" name="genre" value="school" /> Escolar</label>
                    <label><input type="checkbox" name="genre" value="sci-fi" /> Ciencia ficción</label>
                    <label><input type="checkbox" name="genre" value="shoujo" /> Shoujo</label>
                    <label><input type="checkbox" name="genre" value="shoujo-ai" /> Shoujo Ai</label>
                    <label><input type="checkbox" name="genre" value="shounen" /> Shounen</label>
                    <label><input type="checkbox" name="genre" value="shounen-ai" /> Shounen Ai</label>
                    <label><input type="checkbox" name="genre" value="slice-of-life" /> Slice of Life</label>
                    <label><input type="checkbox" name="genre" value="space" /> Espacial</label>
                    <label><input type="checkbox" name="genre" value="sports" /> Deportes</label>
                    <label><input type="checkbox" name="genre" value="super-power" /> Superpoderes</label>
                    <label><input type="checkbox" name="genre" value="vampire" /> Vampiros</label>
                    <label><input type="checkbox" name="genre" value="yaoi" /> Yaoi</label>
                    <label><input type="checkbox" name="genre" value="yuri" /> Yuri</label>
                    <label><input type="checkbox" name="genre" value="harem" /> Harem</label>
                    <label><input type="checkbox" name="genre" value="seinen" /> Seinen</label>
                    <label><input type="checkbox" name="genre" value="josei" /> Josei</label>
                </div>
                <button id="applyFilters" class="apply-btn">Aplicar filtros</button>
            </div>
        </div>


        <div id="loading">Buscando...</div>
        <div id="results"></div>
        <div id="latestReleases"></div>
        <div id="upcomingReleases"></div>
        <div id="genreSections"></div>


    </main>

    <footer-component></footer-component>

    <script src="../js/components/header-component.js"></script>
    <script src="../js/components/footer-component.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/scripts.js"></script>

</body>

</html>
